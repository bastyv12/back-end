{% extends 'base.html' %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<div class="container">
  <h4 class="center-align">Crear una cuenta</h4>

  {% if messages %}
    {% for message in messages %}
      <div class="card-panel red lighten-4 red-text text-darken-4">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" class="col s12">
    {% csrf_token %}

    <div class="input-field">
      <input type="text" id="username" name="username" required>
      <label for="username">Nombre de usuario</label>
    </div>

    <div class="input-field">
      <input type="password" id="password" name="password" required>
      <label for="password">Contraseña</label>
    </div>

    <div class="input-field">
      <input type="email" id="email" name="email" required>
      <label for="email">Correo electrónico</label>
    </div>

    <div class="input-field">
      <input type="text" id="first_name" name="first_name" required>
      <label for="first_name">Nombre</label>
    </div>

    <div class="input-field">
      <input type="text" id="last_name" name="last_name" required>
      <label for="last_name">Apellido</label>
    </div>

    <div class="center-align" style="margin-top: 20px;">
      <button class="btn waves-effect waves-light" type="submit">
        Registrarse
      </button>
    </div>
  </form>

  <p class="center-align" style="margin-top: 20px;">
    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
  </p>
</div>
{% endblock %}
